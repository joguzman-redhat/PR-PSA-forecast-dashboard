apiVersion: v1
kind: ServiceAccount
metadata:
  name: forecast-postgres-backup
  labels:
    app.kubernetes.io/part-of: cloud-forecast
    paas.redhat.com/appcode: NLFC-001
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecast-postgres-backup
  labels:
    app.kubernetes.io/part-of: cloud-forecast
    paas.redhat.com/appcode: NLFC-001
spec:
  schedule: "0 */12 * * *"
  timeZone: America/Bogota
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: forecast-postgres-backup
            app.kubernetes.io/part-of: cloud-forecast
            paas.redhat.com/appcode: NLFC-001
        spec:
          serviceAccountName: forecast-postgres-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.redhat.io/rhel9/postgresql-16:1
              command: [/bin/bash, /opt/backup/backup.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              envFrom:
                - configMapRef:
                    name: forecast-backups
                - secretRef:
                    name: forecast-backups
              env:
                - name: HOME
                  value: /work
                - name: PGHOST
                  value: forecast-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGCONNECT_TIMEOUT
                  value: "15"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: forecast-postgres-admin
                      key: POSTGRESQL_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: forecast-postgres-admin
                      key: POSTGRESQL_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: forecast-postgres-admin
                      key: POSTGRESQL_DATABASE
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/backup
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: forecast-s3-backup-script
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir: {}
