# N8N_EDITOR_BASE_URL y WEBHOOK_URL quedan atados al host de ESTE cluster de
# Demo Platform (efimero, ~48h). Si se reordena un cluster nuevo, el dominio
# cambia -- reobtener con "oc get route forecast-n8n -o jsonpath='{.spec.host}'"
# y actualizar estas dos lineas (ver openshift/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-n8n
  labels:
    app: forecast-n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forecast-n8n
  template:
    metadata:
      labels:
        app: forecast-n8n
    spec:
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
              name: http
          env:
            # Sin esto, con el UID aleatorio no-root de OpenShift, HOME no
            # resuelve a /home/node y n8n intenta escribir en "/" (EACCES).
            - name: HOME
              value: /home/node
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_EDITOR_BASE_URL
              value: "https://forecast-n8n-forecast-app.apps.cluster-j7zjn.dyn.redhatworkshops.io/"
            - name: WEBHOOK_URL
              value: "https://forecast-n8n-forecast-app.apps.cluster-j7zjn.dyn.redhatworkshops.io/"
            - name: N8N_PUSH_BACKEND
              value: websocket
            - name: GENERIC_TIMEZONE
              value: America/Mexico_City
            - name: N8N_LOG_LEVEL
              value: info
            - name: EXECUTIONS_DATA_SAVE_ON_ERROR
              value: all
            - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
              value: all
            - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
              value: "true"
            - name: N8N_METRICS
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            # /home/node/.cache es parte de la imagen (no del PVC) y no es
            # escribible para el UID arbitrario de OpenShift. Solo cachea
            # assets estaticos compilados, no necesita persistir.
            - name: cache
              mountPath: /home/node/.cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forecast-n8n-data
        - name: cache
          emptyDir: {}
