# Reverse proxy minimo para n8n. n8n usa websocket para el push de ejecuciones
# en vivo en el editor: sin el "Upgrade"/"Connection" de abajo, la UI carga
# pero los logs de ejecucion se quedan colgados.
server {
    listen 80;
    server_name _;

    # n8n acepta archivos/binarios en sus nodos (ej. descargar el Excel de
    # Drive); el default de nginx (1m) corta esas subidas.
    client_max_body_size 50m;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ejecuciones largas en el editor no deben cortarse por timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
